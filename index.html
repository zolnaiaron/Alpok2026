<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ifi Linktree</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="images/favicon.png">
    
    <!-- Modern Google Fontok -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/gagalin" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000;
            overflow-x: hidden;
        }

        /* --- HÁTTÉR ÉS OVERLAY --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../images/tuz.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            filter: blur(5px);
            transform: scale(1.05); /* Eltünteti a blur miatti fehér széleket */
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Sötétítő réteg */
            z-index: -1;
        }

        /* --- LINKTREE KONTÉNER --- */
        .linktree-container {
            width: 100%;
            max-width: 480px; /* Klasszikus Linktree (mobil-fókuszú) szélesség */
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }

        /* --- PROFIL/LOGÓ SZEKCIÓ --- */
        .profile-pic {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            
            /* A megadott logó beállítása */
            background-image: url('../images/profil.png'); 
            background-size: contain; /* Hogy a logó ne vágódjon le */
            background-position: center;
            background-repeat: no-repeat;
        }

        .header-title {
            font-family: 'Gagalin', sans-serif;
            font-weight: normal; 
            font-size: 2.8rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .header-bio {
            font-size: 1rem;
            font-weight: 300;
            color: #cccccc;
            margin-bottom: 35px;
            text-align: center;
        }

        /* --- LINKEK / GOMBOK --- */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px; /* Gombok közötti távolság */
        }

        .link-btn {
            display: block;
            width: 100%;
            padding: 18px 24px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px; /* Klasszikus kapszula forma */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }

        /* Letisztult hover effekt */
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        .link-btn:active {
            transform: scale(0.99);
        }

        /* --- ANIMÁCIÓ --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESZPONZIVITÁS --- */
        @media (max-width: 480px) {
            .header-title { font-size: 2.4rem; }
            .profile-pic { width: 80px; height: 80px; }
            .link-btn { padding: 16px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Háttér -->
    <div class="background-container"></div>
    <div class="overlay"></div>

    <!-- Fő tartalom -->
    <div class="linktree-container">
        
        <!-- Profilkép / Logó helye -->
        <div class="profile-pic"></div>

        <!-- Fejléc -->
        <h1 class="header-title">OBGY IFI</h1>
        <p class="header-bio"></p>

        <!-- Gombok -->
        <div class="links-wrapper">
            <a href="https://www.instagram.com/botyiifi/" target="_blank" rel="noopener noreferrer" class="link-btn">
                Instagram
            </a>

            <a href="https://www.obgyifi.hu/ifitabor" class="link-btn">
                Ifitábor információs oldal
            </a>

            <a href="https://www.obgyifi.hu/ifitabor/regisztracio" class="link-btn">
                Ifitábor regisztráció
            </a>

            <a href="https://www.obgyifi.hu/ifitabor/enekbekuldes" class="link-btn">
                Ifitábor ének beküldés
            </a>
            <a href="https://www.obgyifi.hu/ifitabor/program" class="link-btn">
                Ifitábor program
            </a>
        </div>

    </div>

</body>
</html>
